---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-vs-prod
  namespace: vs-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-admin
  namespace: vs-prod
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-admin
  namespace: vs-prod-pg-cluster
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-vs-prod-admin
  namespace: vs-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-admin
subjects:
  - kind: ServiceAccount
    name: flux-vs-prod
    namespace: vs-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-vs-prod-admin
  namespace: vs-prod-pg-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-admin
subjects:
  - kind: ServiceAccount
    name: flux-vs-prod
    namespace: vs-prod
