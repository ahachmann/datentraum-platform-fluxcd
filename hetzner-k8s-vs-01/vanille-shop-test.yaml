---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vs-wawi-test-application
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./base/application-space
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      APPLICATION_NAMESPACE: vanille-shop-test
      APPLICATION: vanille-shop-test
      KUSTOMIZATION_PATH: ./environments/vanille-shop-test