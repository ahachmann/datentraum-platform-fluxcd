---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
spec:
  interval: 10m
  chart:
    spec:
      chart: kubescape-operator
      version: 1.40.3
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: kubescape-values
