# parent=keycloak (statt base): liefert die kc*Class-Properties, damit auch die
# NICHT überschriebenen Seiten (OTP, Passkey, Profil ...) sinnvolle Klassennamen
# im Markup haben, die login.css bedient. Das PatternFly-CSS selbst wird bewusst
# nicht geladen - template.ftl rendert nur `styles`, nicht `stylesCommon`.
parent=keycloak
import=common/keycloak

styles=css/login.css

# leer, weil template.ftl das viewport-Meta selbst setzt - sonst doppelt
meta=

kcHtmlClass=login-pf
kcLoginClass=login-pf-page
kcBodyClass=login-pf-bg

# Ziel des Links auf der Abschlussseite (info.ftl), wenn Keycloak keines mitgibt -
# also immer dann, wenn der Flow ohne redirect_uri gestartet wurde. Leer = kein Link.
# Beispiel: cvoAfterActionUrl=https://iam.cvo-elternrat.de/realms/cvo/account/
# Die Beschriftung steht als cvoAfterActionLink in messages_{de,en}.properties.
cvoAfterActionUrl=
