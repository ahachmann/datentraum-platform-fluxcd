apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vanille-shop-wawi-prod
  namespace: ${FLUX_NAMESPACE}
spec:
  interval: 10m0s
  targetNamespace: ${TARGET_NAMESPACE}
  path: ./applications/vanille-shop-wawi
  prune: true
  sourceRef:
    kind: GitRepository
    name: ${GIT_REPOSITORY}
  postBuild:
    substitute:
      QUOTING: '"'
      VS_ENVIRONMENT: "prod"
      TARGET_NAMESPACE: ${TARGET_NAMESPACE}
      FLUX_NAMESPACE: ${FLUX_NAMESPACE}
      STORAGE_CLASS_NAME: "hcloud-volumes"
      PVC_STORAGE_SIZE: "10Gi"
      SHOP_WARE_API_URL: "https://www.vanille-shop.de/api/"
      SHOP_WARE_API_AUTHORIZATION_URL: "https://www.vanille-shop.de/api/oauth/token"
      SHOW_WARE_INTEGRATION_ENABLED: "true"
      LOGGING_LEVEL_ROOT: "INFO"
      WAWI_DB_SECRET: "vaults/VS-Infra/items/Wawi VS Prod"  
      WAWI_SHOPWARE_SECRET: "vaults/VS-Infra/items/Showpare VS API Key Read Prod"
      WAWI_SMTP_SECRET: "vaults/VS-Infra/items/VS Mail SMTP"
      WAWI_MQTT_SECRET: "vaults/VS-Infra/items/VS Mqtt Client"
      DOMAIN: "${DOMAIN}"
      TLS_SECRET_NAME: "wawi-general-tls"
      CLUSTER_ISSUER: ${CLUSTER_ISSUER}
      INGRESS_CLASS: "traefik"