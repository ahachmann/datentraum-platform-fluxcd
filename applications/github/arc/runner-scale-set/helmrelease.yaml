# infrastructure/arc/runner-scale-set/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: ${TARGET_NAMESPACE}
spec:
  interval: 1h
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: ${TARGET_NAMESPACE}
  values:
    githubConfigUrl: "https://github.com/Han-KOOK-family"
    githubConfigSecret: arc-github-app-secret
    minRunners: 1
    maxRunners: 5
    containerMode:
      type: dind
    # kein template-Block – das Chart injiziert DinD vollständig selbst