# infrastructure/arc/runner-scale-set/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 1h
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  values:
    githubConfigUrl: "https://github.com/Han-KOOK-family"
    githubConfigSecret: arc-github-app-secret

    minRunners: 0
    maxRunners: 5

    containerMode:
      type: dind
    # kein template-Block – das Chart injiziert DinD vollständig selbst