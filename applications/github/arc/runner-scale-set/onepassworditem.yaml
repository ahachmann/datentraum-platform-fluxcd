# infrastructure/arc/runner-scale-set/onepassworditem.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-app-secret   # wird gleichzeitig der Name des K8s Secrets
  namespace: arc-runners
spec:
  itemPath: "${ONEPASSWORD_ITEM_PATH}"  # z.B. "vaults/VS-Infra/items/ARC GitHub App Secret"