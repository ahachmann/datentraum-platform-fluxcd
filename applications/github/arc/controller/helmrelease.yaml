apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: ${TARGET_NAMESPACE}
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: arc
  values:
    replicaCount: 1