apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monitoring/prometheus-stack
  - one-password-secrets.yaml
patches:
  - target:
      kind: OnePasswordItem
      name: grafana-admin-credentials
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/itemPath
        value: "vaults/DT-Infra/items/Grafana Admin"
  - target: 
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/values
        value:
          grafana:
            operator:
              dashboardsConfigMapRefEnabled: false
            admin:
              ## Name of the secret. Can be templated.
              existingSecret: "grafana-admin-credentials"
              userKey: username
              passwordKey: password
            ingress:
              enabled: true
              ingressClassName: traefik 
              annotations: 
                cert-manager.io/cluster-issuer: "letsencrypt-prod"
              labels: {}
              hosts: 
                - grafana.datentraum.de
              path: /
              tls: 
                - secretName: grafana-general-tls
                  hosts:
                    - grafana.datentraum.de
            alertmanager:
              enabled: true
          alertmanager:
            alertmanagerSpec:
              ## 1Password-Secret in den Alertmanager-Pod mounten:
              ## /etc/alertmanager/secrets/alertmanager-pushover/{user_key,token}
              secrets:
                - alertmanager-pushover
            config:
              route:
                group_by: ["namespace", "alertname"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
                receiver: "pushover"
                routes:
                  - receiver: "null"
                    matchers:
                      - alertname = "Watchdog"
                  - receiver: "null"
                    matchers:
                      - alertname = "KubeletDown"
                  - receiver: "null"
                    matchers:
                      - alertname = "KubeAPIDown"
              receivers:
                - name: "null"
                - name: "pushover"
                  pushover_configs:
                    - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
                      token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
                      send_resolved: true
                      priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
                      title: '{{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }} {{ .CommonLabels.alertname }}'
                      message: |-
                        {{ range .Alerts }}{{ .Annotations.summary }}
                        {{ .Annotations.description }}
                        {{ end }}
                      url: https://grafana.datentraum.de/alerting/list
                      url_title: In Grafana oeffnen

