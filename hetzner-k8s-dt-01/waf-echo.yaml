---
apiVersion: v1
kind: Namespace
metadata:
  name: waf-echo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waf-echo
  namespace: flux-system
spec:
  interval: 10m0s
  targetNamespace: waf-echo
  path: ./base/security/waf-echo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      DOMAIN: waf-echo.hachmann.hamburg
      INGRESS: traefik
      CLUSTER_ISSUER: letsencrypt-prod
